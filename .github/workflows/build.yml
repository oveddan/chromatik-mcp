name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: package
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Compile + the full JUnit suite, headless: embed test (EmbeddedMcpServerTest)
      # and every domain/handler test. com.heronarts:lx:1.2.1 resolves from Maven Central.
      - name: mvn package
        run: mvn -B package

      # Live load gate: boot LX with no UI, confirm it discovers the shaded jar from a
      # Packages dir and runs ChromatikMcpPlugin.initialize(). setup-java exports JAVA_HOME,
      # which verify-load.sh resolves first.
      - name: headless load gate
        run: ./scripts/verify-load.sh
