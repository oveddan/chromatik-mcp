name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: package
    steps:
      - uses: actions/checkout@v4

      - name: LX version bump helper test
        run: ../scripts/test-bump-lx-version.sh

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Published Heron Arts bytecode baseline
        run: ../scripts/verify-heronarts-bytecode.sh

      # Compile + the full JUnit suite, headless: embed test (EmbeddedMcpServerTest)
      # and every domain/handler test. com.heronarts:{lx,glx,glxstudio}:1.2.2 resolve
      # from Maven Central on a clean runner.
      - name: mvn package
        run: mvn -B package

      # Live load gate: boot LX with no UI, confirm it discovers the shaded jar from a
      # Packages dir and runs ChromatikMcpPlugin.initialize(). setup-java exports JAVA_HOME,
      # which verify-load.sh resolves first.
      - name: headless load gate
        run: ./scripts/verify-load.sh

  # Docs drift gates. Both scripts use only node builtins, so there is nothing to
  # install — a tool rename that orphans a name referenced in the plugin's skill, or a
  # stale generated tool reference, fails here rather than reaching main.
  docs-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # docs/tools.md must match what generate-tool-reference.mjs would produce from
      # docs/tools.json.
      - name: tools.md matches tools.json
        run: node scripts/generate-tool-reference.mjs --check

      # Every tool-shaped name referenced under agent-plugin/ must exist in the live
      # tool catalog (docs/tools.json).
      - name: agent-plugin tool names match tools.json
        run: node scripts/check-plugin-tool-names.mjs
