name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: package
    steps:
      - uses: actions/checkout@v4

      - name: LX version bump helper test
        run: ../scripts/test-bump-lx-version.sh

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Published Heron Arts bytecode baseline
        run: ../scripts/verify-heronarts-bytecode.sh

      # Compile + the full JUnit suite, headless: embed test (EmbeddedMcpServerTest)
      # and every domain/handler test. com.heronarts:{lx,glx,glxstudio}:1.2.2 resolve
      # from Maven Central on a clean runner.
      - name: mvn package
        run: mvn -B package

      # Live load gate: boot LX with no UI, confirm it discovers the shaded jar from a
      # Packages dir and runs ChromatikMcpPlugin.initialize(). setup-java exports JAVA_HOME,
      # which verify-load.sh resolves first.
      - name: headless load gate
        run: ./scripts/verify-load.sh

  # Site-side drift gates for the agent plugin (agent-plugin/). deploy-docs.yml only runs
  # on pushes to main, so without this job a PR could land a stale driving.md or a tool
  # rename that silently orphans a name referenced in the plugin's skill undetected.
  plugin-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # src/content/docs/driving.md must match what generate-driving-page.mjs would
      # produce from agent-plugin/skills/driving-chromatik/SKILL.md.
      - name: driving.md matches SKILL.md
        run: npm run driving-ref -- --check

      # src/content/docs/tools.md must match what generate-tool-reference.mjs would
      # produce from src/data/tools.json.
      - name: tools.md matches tools.json
        run: npm run tools-ref -- --check

      # Every tool-shaped name referenced under agent-plugin/ must exist in the live
      # tool catalog (src/data/tools.json).
      - name: agent-plugin tool names match tools.json
        run: npm run check:plugin-tool-names
