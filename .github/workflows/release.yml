name: release (tagged)

# Cut a versioned release: bump <version> in package/pom.xml, merge, then
#   git tag v0.1.0 && git push origin v0.1.0
# This builds the jar (full test gate) and creates a GitHub Release, making
#   https://github.com/oveddan/chromatik-mcp/releases/latest/download/chromatik-mcp.jar
# serve the newest tagged release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: package
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Full gate — never publish a jar that didn't pass the suite
      - name: mvn package
        run: mvn -B package

      - name: headless load gate
        run: ./scripts/verify-load.sh

      - name: Stage jar with stable name
        id: jar
        run: |
          JAR=$(ls target/chromatik-mcp-*.jar | head -1)
          echo "versioned=$(basename "$JAR")" >> "$GITHUB_OUTPUT"
          cp "$JAR" target/chromatik-mcp.jar

      - name: Create versioned release
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes \
            target/chromatik-mcp.jar "target/${{ steps.jar.outputs.versioned }}"
