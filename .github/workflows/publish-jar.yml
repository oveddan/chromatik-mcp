name: publish jar (rolling latest)

# Every push to main touching package/ rebuilds the jar (full test gate) and
# updates the rolling `latest` prerelease, so
#   https://github.com/oveddan/chromatik-mcp/releases/download/latest/chromatik-mcp.jar
# always serves the newest main build. Versioned releases are cut by pushing a
# v* tag — see release.yml.

on:
  push:
    branches: [main]
    paths:
      - "package/**"
      - ".github/workflows/publish-jar.yml"

permissions:
  contents: write

# Overlapping runs race on the shared `latest` release — an older run's upload
# could land last and publish a stale jar. One at a time, newest wins.
concurrency:
  group: publish-latest
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: package
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      # Full gate — never publish a jar that didn't pass the suite
      - name: mvn package
        run: mvn -B package

      - name: headless load gate
        run: ./scripts/verify-load.sh

      - name: Stage jar with stable name
        run: cp "$(ls target/chromatik-mcp-*.jar | head -1)" target/chromatik-mcp.jar

      # Only the stable-named jar rides the rolling release — versioned asset
      # names would pile up across pom version bumps (--clobber only replaces
      # same-named assets). Versioned jars belong to tagged releases.
      # Assets upload BEFORE the tag moves, so a failed upload leaves the tag
      # pointing at the commit whose jar is actually being served.
      - name: Update rolling `latest` prerelease
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --prerelease --title "Latest build (main)" --notes "placeholder"
          # one-time cleanup from the lx-mcp → chromatik-mcp rename: --clobber
          # can't replace a differently-named asset, so the stale jar would be
          # served forever from the old download URL
          gh release delete-asset latest lx-mcp.jar -y 2>/dev/null || true
          gh release upload latest target/chromatik-mcp.jar --clobber
          git tag -f latest
          git push -f origin latest
          gh release edit latest --prerelease --title "Latest build (main)" \
            --notes "Rolling build of main — commit ${GITHUB_SHA}. Updated automatically on every push that touches package/. For a stable download URL use: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/chromatik-mcp.jar"
